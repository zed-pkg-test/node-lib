name: package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml

      - name: Verify Zed and npm metadata agree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          native = json.loads(Path("package.json").read_text())
          with Path(".zpkg.toml").open("rb") as handle:
              zed = tomllib.load(handle)["package"]

          assert native["name"] == f"@{zed['org']}/{zed['name']}"
          assert native["version"] == zed["version"]
          assert native["license"] == zed["license"]
          assert zed["repository"]["url"] == "https://github.com/zed-pkg-test/node-lib"
          PY

      - name: Test API and packed contents in Node 22
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            node:22-bookworm-slim \
            sh -euc '
              npm test
              npm pack --dry-run --json > /tmp/pack.json
              node - <<"NODE"
              const fs = require("node:fs");
              const report = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"));
              const files = report[0].files.map(({ path }) => path).sort();
              const expected = ["README.md", "package.json", "src/index.js"];
              if (JSON.stringify(files) !== JSON.stringify(expected)) {
                throw new Error(`unexpected npm package contents: ${JSON.stringify(files)}`);
              }
              NODE
            '
