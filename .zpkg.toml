[package]
org = "zed-pkg-test"
name = "node-lib"
version = "1.0.0"
description = "A tiny library sourced via zed (complements npm)."
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg-test/node-lib"

[publish]
smoke_test = "node -e 'const p=require(process.env.ZED_PKG_TEST_TARGET);if(p.greet(\"r2g\")!==\"hello r2g from @zed-pkg-test/node-lib\")process.exit(1)'"
